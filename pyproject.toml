[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

filterwarnings = ["error::RuntimeWarning", "ignore:Deprecated since version v22.2:telegram.warnings.PTBDeprecationWarning"]
